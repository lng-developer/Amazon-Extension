<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>APO LNG - Popup</title>
    <link rel="stylesheet" href="options.css" />
  </head>

  <body>
    <div class="wrap">

      <!-- HEADER -->
      <div class="header">
        <div class="header-logo">
          <span class="header-icon">🚀</span>
          <span class="header-title">APO LNG</span>
        </div>
        <span class="header-badge">v3.0-Test</span>
      </div>

      <!-- CONFIG -->
      <div class="card">
        <div class="card-title">🔧 Configuration</div>
        <div class="input-grid">
          <div class="input-group">
            <label>API Base URL</label>
            <input id="ingestUrl" placeholder="https://api.lngmerch.co" />
          </div>
          <div class="input-group">
            <label>Shop ID</label>
            <input id="shopId" placeholder="6881aba9c1bbdfc541b5cd4d" />
          </div>
        </div>
        <div class="btn-group" style="margin-top:10px;">
          <button id="saveBtn" class="btn btn-green" style="flex:1;">💾 Save</button>
          <button id="btnSocketConnect" class="btn btn-blue" style="flex:1;">🔌 Connect Socket</button>
          <button id="btnAutoConfig" class="btn btn-orange" style="flex:1;">⚙️ Auto Config</button>
        </div>
        <div class="input-group" style="margin-top:10px;">
          <label>⏰ Auto Connect Socket (phút) — 0 = tắt</label>
          <div style="display:flex; gap:6px;">
            <input id="socketAutoInterval" type="number" min="0" step="1" placeholder="60" style="flex:1;" />
            <button id="btnSaveSocketAutoInterval" class="btn btn-green" style="flex:0 0 auto;">💾 Lưu</button>
          </div>
        </div>
      </div>

      <!-- AUTO CONFIG MODAL -->
      <div id="autoConfigOverlay" class="modal-overlay">
        <div class="modal-box">
          <div class="modal-header">
            <span class="modal-title">⚙️ Auto Config</span>
            <button id="closeAutoConfig" class="modal-close">✕</button>
          </div>
          <div id="autoConfigList" class="modal-list">
            <div class="modal-loading">Đang tải...</div>
          </div>
          <button id="reloadAutoConfig" class="btn btn-blue" style="width:100%; margin-top:4px;">🔄 Reload</button>
        </div>
      </div>

      <!-- IMPORT
      <div class="card">
        <div class="card-title">▶️ Import</div>
        <div class="row" style="margin-bottom:10px;">
          <div class="input-group">
            <label for="adsDate">Ads Date (YYYY-MM-DD)</label>
            <input id="adsDate" placeholder="2025-10-17" />
          </div>
          <div class="input-group" style="display:flex; align-items:flex-end;">
            <button id="testAds" class="btn btn-purple" style="width:100%;">📈 Export Ads Spend</button>
          </div>
        </div>
        <button id="btnAutoRunNow" class="btn btn-default" style="width:100%;">▶️ Import order from Amazon</button>
      </div> -->

      <!-- LOG -->
      <div class="card">
        <div class="card-title">📜 Log</div>
        <pre id="log"></pre>
      </div>

    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
